name: Build and Release Windows Installer

on:
  push:
    tags:
      - "win-v*"

jobs:
  build:
    runs-on: windows-latest

    # El proyecto de Windows vive en windows/. Todos los pasos "run" se ejecutan desde ahi.
    defaults:
      run:
        working-directory: windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.x"

      - name: Extract App Version from csproj
        id: get_version
        shell: powershell
        run: |
          [xml]$csproj = Get-Content .\localtunes.csproj
          $version = $csproj.Project.PropertyGroup.Version
          if (-not $version) { $version = "1.0.0" }
          Add-Content -Path $env:GITHUB_ENV -Value "APP_VERSION=$version"
          Write-Output "Building version: $version"

      - name: Validate tag matches csproj version
        shell: powershell
        run: |
          $tag = "${{ github.ref_name }}" -replace '^win-v', ''
          if ($tag -ne $env:APP_VERSION) {
            Write-Error "El tag ($tag) no coincide con la version del .csproj ($env:APP_VERSION). Actualiza el .csproj y vuelve a crear el tag."
            exit 1
          }

      - name: Write version.json for the UI
        shell: powershell
        run: |
          $json = '{' + "`n" + '  "version": "' + $env:APP_VERSION + '"' + "`n" + '}'
          [System.IO.File]::WriteAllText("$PWD\web_assets\version.json", $json, (New-Object System.Text.UTF8Encoding($false)))
          Get-Content web_assets\version.json

      - name: Restore dependencies
        run: dotnet restore localtunes.csproj

      - name: Publish .NET App (x64)
        run: |
          dotnet publish localtunes.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishReadyToRun=true -p:PublishTrimmed=false -o "build/v${{ env.APP_VERSION }}/win-x64"
      - name: Publish .NET App (x86)
        run: |
          dotnet publish localtunes.csproj -c Release -r win-x86 --self-contained true -p:PublishSingleFile=true -p:PublishReadyToRun=true -p:PublishTrimmed=false -o "build/v${{ env.APP_VERSION }}/win-x86"

      - name: Install Inno Setup
        run: |
          winget install JRSoftware.InnoSetup --accept-source-agreements --accept-package-agreements

      - name: Compile Inno Setup Script
        shell: powershell
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion="${{ env.APP_VERSION }}" setup.iss

      - name: Upload Installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: windows/build/installer/*.exe
          name: Local Tunes v${{ env.APP_VERSION }}
          body: "Instalador oficial de Local Tunes para Windows (x64 / x86)."
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
